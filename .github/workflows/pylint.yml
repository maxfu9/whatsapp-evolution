name: Pylint

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.14 / Frappe v16
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FRAPPE_STREAM_LOGGING: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: frappe/frappe
          ref: v16.25.0
          path: .ci-deps/frappe
      - uses: actions/checkout@v7.0.1
        with:
          repository: frappe/erpnext
          ref: v16.26.1
          path: .ci-deps/erpnext
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci_tools/requirements.txt
            .ci-deps/frappe/pyproject.toml
            .ci-deps/erpnext/pyproject.toml
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev pkg-config libmagic1
      - name: Install pinned tools and real framework dependencies
        run: python -m pip install -r ci_tools/requirements.txt -e .ci-deps/frappe -e .ci-deps/erpnext -e .
      - name: Pylint errors and style-debt ratchet
        run: python -m ci_tools.lint
      - name: Offline regression tests (no site or WhatsApp credentials)
        run: >-
          python -m unittest
          ci_tools.test_quality
          whatsapp_evolution.utils.test_deletion
          whatsapp_evolution.utils.test_reliability
          whatsapp_evolution.utils.test_delivery
          whatsapp_evolution.utils.test_utils.TestEvolutionProviderV2
      - name: Upload complete lint report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pylint-report
          path: artifacts/pylint.json
          if-no-files-found: ignore
